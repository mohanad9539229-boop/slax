<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manhwa AI Finder</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d0d0d;
            --card-bg: #16161a;
            --accent-color: #ff2a4b;
            --accent-hover: #d91b3a;
            --text-color: #ffffff;
            --text-dim: #a0a0a0;
            --border-color: #26262e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--text-color);
        }

        header h1 span {
            color: var(--accent-color);
        }

        header p {
            color: var(--text-dim);
            margin-top: 0.5rem;
        }

        .search-container {
            width: 100%;
            max-width: 600px;
            display: flex;
            gap: 10px;
            margin-bottom: 2.5rem;
        }

        select, button {
            padding: 0.8rem 1.2rem;
            border-radius: 8px;
            font-size: 1rem;
            border: 1px solid var(--border-color);
            outline: none;
        }

        select {
            flex: 1;
            background-color: var(--card-bg);
            color: var(--text-color);
            cursor: pointer;
        }

        button {
            background-color: var(--accent-color);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        .results-grid {
            width: 100%;
            max-width: 1100px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .card:hover {
            transform: translateY(-5px);
            border-color: var(--accent-color);
        }

        .card img {
            width: 100%;
            height: 300px;
            object-fit: cover;
        }

        .card-content {
            padding: 1rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            line-height: 1.3;
        }

        .card-score {
            color: #ffd700;
            font-size: 0.9rem;
            font-weight: bold;
            margin-bottom: 0.8rem;
        }

        .card-link {
            text-align: center;
            background: #22222a;
            color: var(--text-color);
            text-decoration: none;
            padding: 0.5rem;
            border-radius: 6px;
            font-size: 0.85rem;
            font-weight: bold;
            transition: background 0.2s;
        }

        .card-link:hover {
            background: var(--accent-color);
        }

        .status-msg {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--text-dim);
            font-size: 1.2rem;
            margin-top: 2rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>MANHWA <span>FINDER</span></h1>
        <p>مستكشف المانهوا السريع - اختر التصنيف واستخرج أفضل المانهوا مجاناً</p>
    </header>

    <div class="search-container">
        <select id="genreSelect">
            <option value="">-- اختر التصنيف المطلوبة --</option>
            <option value="1">Action (أكشن)</option>
            <option value="2">Adventure (مغامرة)</option>
            <option value="4">Comedy (كوميديا)</option>
            <option value="8">Drama (دراما)</option>
            <option value="10">Fantasy (فانتازيا)</option>
            <option value="14">Horror (رعب)</option>
            <option value="22">Romance (رومانسي)</option>
            <option value="24">Sci-Fi (خيال علمي)</option>
            <option value="36">Slice of Life (شريحة من الحياة)</option>

            <option value="37">Supernatural (خارق للعادة)</option>
            <option value="62">Isekai / Reincarnation (انتقال لـ عالم آخر)</option>
        </select>
        <button onclick="searchManhwa()">بحث الان</button>
    </div>

    <div class="results-grid" id="resultsGrid">
        <div class="status-msg">اختر تصنيفاً واضغط على زر البحث للبدء...</div>
    </div>

    <script>
        async function searchManhwa() {
            const genreId = document.getElementById('genreSelect').value;
            const resultsGrid = document.getElementById('resultsGrid');

            if (!genreId) {
                resultsGrid.innerHTML = '<div class="status-msg">يرجى اختيار تصنيف أولاً!</div>';
                return;
            }

            resultsGrid.innerHTML = '<div class="status-msg">جاري جلب أفضل المانهوا... ⏳</div>';

            try {
                // Jikan API (MyAnimeList Engine) configured specifically for Korean Manhwa
                const response = await fetch(`https://api.jikan.moe/v4/manga?type=manhwa&genres=${genreId}&order_by=score&sort=desc&limit=12`);
                const data = await response.json();

                if (!data.data || data.data.length === 0) {
                    resultsGrid.innerHTML = '<div class="status-msg">لم يتم العثور على مانهوا لهذا التصنيف.</div>';
                    return;
                }

                resultsGrid.innerHTML = '';

                data.data.forEach(item => {
                    const title = item.title_japanese || item.title || 'عنوان غير معروف';
                    const image = item.images?.jpg?.large_image_url || 'https://via.placeholder.com/225x350';
                    const score = item.score ? `⭐ ${item.score}` : 'بدون تقييم';
                    const url = item.url;

                    const cardHtml = `
                        <div class="card">
                            <img src="${image}" alt="${title}" loading="lazy">
                            <div class="card-content">
                                <div>
                                    <div class="card-title">${title}</div>
                                    <div class="card-score">${score}</div>
                                </div>
                                <a href="${url}" target="_blank" class="card-link">عرض التفاصيل ↗</a>
                            </div>
                        </div>
                    `;
                    resultsGrid.insertAdjacentHTML('beforeend', cardHtml);
                });

            } catch (error) {
                console.error(error);
                resultsGrid.innerHTML = '<div class="status-msg">حدث خطأ أثناء جلب البيانات. حاول مرة أخرى.</div>';
            }
        }
    </script>
</body>
</html>
