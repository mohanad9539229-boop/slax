<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLAX MANHWA AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0b0e;
            --card-bg: #141419;
            --accent-color: #ff2a4b;
            --accent-hover: #d91b3a;
            --text-color: #ffffff;
            --text-dim: #a0a0a0;
            --border-color: #23232c;
            --selected-border: #00ff88;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem 5rem 1rem;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: 1px;
        }

        header h1 span {
            color: var(--accent-color);
        }

        header p {
            color: var(--text-dim);
            margin-top: 0.5rem;
        }

        .search-container {
            width: 100%;
            max-width: 650px;
            display: flex;
            gap: 10px;
            margin-bottom: 1.5rem;
        }

        select, button {
            padding: 0.8rem 1.2rem;
            border-radius: 8px;
            font-size: 1rem;
            border: 1px solid var(--border-color);
            outline: none;
        }

        select {
            flex: 1;
            background-color: var(--card-bg);
            color: var(--text-color);
            cursor: pointer;
        }

        button {
            background-color: var(--accent-color);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        .selection-bar {
            width: 100%;
            max-width: 1100px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 0.8rem 1.2rem;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .selection-count {
            font-weight: bold;
            color: var(--selected-border);
        }

        .action-btn {
            background: #22222b;
            font-size: 0.85rem;
            padding: 0.5rem 1rem;
            border-radius: 6px;
        }

        .results-grid {
            width: 100%;
            max-width: 1100px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.2rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            position: relative;
            user-select: none;
            transition: all 0.2s ease;
        }

        .card:hover {
            border-color: var(--accent-color);
        }

        .card.selected {
            border-color: var(--selected-border) !important;
            box-shadow: 0 0 12px rgba(0, 255, 136, 0.2);
        }

        .card-checkbox {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 24px;
            height: 24px;
            background: rgba(0,0,0,0.8);
            border: 2px solid var(--border-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: transparent;
            z-index: 2;
        }

        .card.selected .card-checkbox {
            background: var(--selected-border);
            border-color: var(--selected-border);
            color: #000;
            font-weight: bold;
        }

        .card img {
            width: 100%;
            height: 280px;
            object-fit: cover;
        }

        .card-content {
            padding: 0.8rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .card-title {
            font-size: 0.95rem;
            font-weight: 700;
            margin-bottom: 0.4rem;
            line-height: 1.3;
        }

        .card-score {
            color: #ffd700;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .load-more-container {
            width: 100%;
            max-width: 1100px;
            display: flex;
            justify-content: center;
            margin-top: 2rem;
        }

        .load-more-btn {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 0.8rem 2rem;
            width: 100%;
            max-width: 300px;
        }

        .load-more-btn:hover {
            border-color: var(--accent-color);
        }
    </style>
</head>
<body>

    <header>
        <h1>SLAX <span>MANHWA AI</span></h1>
        <p>مستكشف المانهوا الضخم (1000+ مانهوا) - اختر التصنيف وحدد الأعمال بسهولة</p>
    </header>

    <div class="search-container">
        <select id="genreSelect">
            <option value="all">الكل (جميع المانهوا - 1000 عمل 🔥)</option>
            <option value="action">أكشن وترقية مستويات (Action & System)</option>
            <option value="fantasy">فانتازيا وسحر (Fantasy & Magic)</option>
            <option value="reincarnation">عالم آخر وتجسد (Isekai & Reincarnation)</option>
            <option value="murim">موريم وفنون قتالية (Murim & Martial Arts)</option>
            <option value="romance">رومانسي ودراما (Romance & Drama)</option>
        </select>
        <button onclick="resetAndSearch()">بحث الان</button>
    </div>

    <div class="selection-bar">
        <div>المحدد حالياً: <span class="selection-count" id="selectCount">0</span> مانهوا</div>
        <button class="action-btn" onclick="copySelected()">نسخ العناوين المختارة 📋</button>
    </div>

    <div class="results-grid" id="resultsGrid"></div>

    <div class="load-more-container">
        <button class="load-more-btn" id="loadMoreBtn" onclick="loadMore()">عرض المزيد من الأعمال ⬇️</button>
    </div>

    <script>
        const genres = ['action', 'fantasy', 'reincarnation', 'murim', 'romance'];
        const prefixes = [
            'Solo', 'The Legendary', 'Return of the', 'Omniscient', 'The Greatest', 
            'Infinite', 'Ranker', 'Absolute', 'Overpowered', 'Reincarnated', 
            'Heavenly', 'Shadow', 'Leveling', 'Boundless', 'Supreme', 'S-Rank'
        ];
        const nouns = [
            'Necromancer', 'Swordmaster', 'Demon King', 'Monarch', 'Player', 
            'Martial Artist', 'Archmage', 'Cultivator', 'Hunter', 'Hero', 
            'Spearman', 'Guild Master', 'Alchemist', 'Slayer', 'Dragon Knight'
        ];
        const suffixes = [
            'in the Modern World', 'of the Mount Hua', 'System', 'Reboot', 
            'Academy', 'God Level', 'Chronicles', 'Regression', 'Ascension'
        ];

        const defaultCovers = [
            'https://cdn.myanimelist.net/images/manga/3/222234.jpg',
            'https://cdn.myanimelist.net/images/manga/3/232121.jpg',
            'https://cdn.myanimelist.net/images/manga/1/220221.jpg',
            'https://cdn.myanimelist.net/images/manga/3/235832.jpg',
            'https://cdn.myanimelist.net/images/manga/3/245892.jpg',
            'https://cdn.myanimelist.net/images/manga/2/227568.jpg',
            'https://cdn.myanimelist.net/images/manga/3/255621.jpg'
        ];

        // توليد قائمة مكونة من 1000 مانهوا تلقائياً
        const manhwaDB = Array.from({ length: 1000 }, (_, i) => {
            const p = prefixes[i % prefixes.length];
            const n = nouns[(i + 3) % nouns.length];
            const s = suffixes[(i + 7) % suffixes.length];
            const g = [genres[i % genres.length], genres[(i + 2) % genres.length]];
            const score = (7.0 + ((i * 13) % 29) / 10).toFixed(1);
            const img = defaultCovers[i % defaultCovers.length];

            return {
                title: `${p} ${n} ${s} #${i + 1}`,
                genre: g,
                score: `⭐ ${score}`,
                img: img
            };
        });

        let selectedList = new Set();
        let currentPage = 1;
        const itemsPerPage = 24;
        let currentFilteredList = [];

        function resetAndSearch() {
            currentPage = 1;
            document.getElementById('resultsGrid').innerHTML = '';
            searchManhwa();
        }

        function searchManhwa() {
            const genre = document.getElementById('genreSelect').value;
            
            currentFilteredList = genre === 'all' 
                ? manhwaDB 
                : manhwaDB.filter(item => item.genre.includes(genre));

            renderPage();
        }

        function renderPage() {
            const resultsGrid = document.getElementById('resultsGrid');
            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;
            const itemsToRender = currentFilteredList.slice(start, end);

            itemsToRender.forEach(item => {
                const card = document.createElement('div');
                card.className = 'card' + (selectedList.has(item.title) ? ' selected' : '');

                card.innerHTML = `
                    <div class="card-checkbox">✓</div>
                    <img src="${item.img}" alt="${item.title}" loading="lazy">
                    <div class="card-content">
                        <div class="card-title">${item.title}</div>
                        <div class="card-score">${item.score}</div>
                    </div>
                `;

                card.onclick = () => {
                    if (selectedList.has(item.title)) {
                        selectedList.delete(item.title);
                        card.classList.remove('selected');
                    } else {
                        selectedList.add(item.title);
                        card.classList.add('selected');
                    }
                    updateCount();
                };

                resultsGrid.appendChild(card);
            });

            const loadMoreBtn = document.getElementById('loadMoreBtn');
            if (end >= currentFilteredList.length) {
                loadMoreBtn.style.display = 'none';
            } else {
                loadMoreBtn.style.display = 'block';
            }
        }

        function loadMore() {
            currentPage++;
            renderPage();
        }

        function updateCount() {
            document.getElementById('selectCount').innerText = selectedList.size;
        }

        function copySelected() {
            if (selectedList.size === 0) {
                alert('لم تقم بتحديد أي مانهوا بعد!');
                return;
            }
            const textToCopy = Array.from(selectedList).join('\n');
            navigator.clipboard.writeText(textToCopy);
            alert(`تم نسخ (${selectedList.size}) مانهوا إلى الحافظة بنجاح!`);
        }

        window.onload = resetAndSearch;
    </script>
</body>
</html>
