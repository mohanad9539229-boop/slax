<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLAX Manhwa Hub v3</title>
    <style>
        :root {
            --bg-color: #0b0b0e;
            --card-bg: #14141c;
            --accent-color: #ff2a4b;
            --accent-hover: #d91e3d;
            --border-color: #222230;
            --text-color: #ffffff;
            --text-dim: #9a9ab0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 2rem 1rem; text-align: center; }

        .container { max-width: 1200px; margin: 0 auto; }
        
        header { margin-bottom: 2rem; }
        h1 { font-size: 2.2rem; font-weight: 800; letter-spacing: 1px; }
        h1 span { color: var(--accent-color); }
        p.sub { color: var(--text-dim); margin-top: 0.4rem; font-size: 0.95rem; }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            align-items: center;
            margin-bottom: 2rem;
        }

        input[type="text"] {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 0.8rem 1.2rem;
            border-radius: 8px;
            outline: none;
            width: 100%;
            max-width: 300px;
            font-size: 0.95rem;
        }

        input[type="text"]:focus { border-color: var(--accent-color); }

        .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 0.8rem 1.6rem;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn:hover { background-color: var(--accent-hover); transform: translateY(-1px); }
        .btn:disabled { background-color: #2a2a38; color: #666; cursor: not-allowed; transform: none; }
        .btn-outline { background: transparent; border: 1px solid var(--border-color); color: var(--text-dim); }
        .btn-outline:hover { background: var(--card-bg); color: #fff; }

        .counter-badge {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 0.8rem 1.2rem;
            border-radius: 8px;
            font-size: 0.85rem;
            color: var(--text-dim);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1.2rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            text-align: right;
            transition: transform 0.2s ease, border-color 0.2s ease;
            cursor: pointer;
            position: relative;
        }

        .card:hover { transform: translateY(-4px); border-color: var(--accent-color); }
        .card img { width: 100%; height: 250px; object-fit: cover; background: #1a1a24; }
        .card-info { padding: 0.8rem; display: flex; flex-direction: column; gap: 0.4rem; }
        .card-title { font-size: 0.9rem; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
        }

        .score { color: #ffd700; font-weight: bold; }
        .genres { font-size: 0.75rem; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Modal / النافذة المنبثقة */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 1rem;
        }

        .modal-overlay.active { display: flex; }

        .modal {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            max-width: 650px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            text-align: right;
            padding: 1.5rem;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .modal-close {
            position: absolute;
            top: 1rem; left: 1rem;
            background: transparent;
            border: none;
            color: var(--text-dim);
            font-size: 1.5rem;
            cursor: pointer;
        }

        .modal-header { display: flex; gap: 1.2rem; margin-bottom: 1rem; }
        .modal-header img { width: 120px; height: 170px; object-fit: cover; border-radius: 8px; }
        .modal-details { display: flex; flex-direction: column; gap: 0.5rem; justify-content: center; }
        .modal-title { font-size: 1.2rem; font-weight: bold; color: #fff; }
        .modal-desc { font-size: 0.85rem; color: var(--text-dim); line-height: 1.5; margin-bottom: 1rem; max-height: 150px; overflow-y: auto; }

        .modal-actions { display: flex; gap: 10px; flex-wrap: wrap; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>SLAX <span>MANHWA HUB V3</span></h1>
            <p class="sub">استكشاف المانهوات مع نظام استبعاد تلقائي وفلترة مخصصة</p>
        </header>
        
        <div class="controls">
            <input type="text" id="searchInput" placeholder="بحث بالاسم..." oninput="filterLocalResults()">
            <button class="btn" id="loadBtn" onclick="fetchUniqueManhwa()">جلب دفعات جديدة ➔</button>
            <button class="btn btn-outline" onclick="resetExclusions()">إعادة ضبط القائمة</button>
            <div class="counter-badge" id="excludedCount">المستبعدة: 0</div>
        </div>

        <div class="grid" id="manhwaGrid"></div>
    </div>

    <!-- Modal التفاصيل -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
        <div class="modal" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <div class="modal-header">
                <img id="modalImg" src="" alt="Cover">
                <div class="modal-details">
                    <div class="modal-title" id="modalTitle">اسم المانهوا</div>
                    <div class="score" id="modalScore">⭐ 0.0</div>
                    <div class="genres" id="modalGenres">التصنيف</div>
                </div>
            </div>
            <div class="modal-desc" id="modalDesc">الوصف غير متوفر حالياً.</div>
            <div class="modal-actions">
                <button class="btn" onclick="copyTitle()">نسخ الاسم</button>
                <a id="searchGoogleBtn" target="_blank" class="btn btn-outline">بحث في Google</a>
            </div>
        </div>
    </div>

    <script>
        const initialExcluded = [
            136331, 137304, 117540, 130870, 97897, 115000, 151025, 103156, 137595, 119276, 
            177706, 113666, 130429, 141007, 120385, 116506, 175262, 75275, 117536, 52651, 
            116382, 150836, 114542, 182066, 153432, 85155, 128882, 130149, 113488, 130229, 
            170894, 60079, 173020, 110605, 141958, 113055, 129210, 141013, 153880, 178379, 
            136204, 124577, 121565, 155485, 111075, 110042, 167834, 107720, 164857, 107918,
            141479, 120440, 165182, 107518, 165287, 85869, 110472, 123739, 175946, 119363, 
            159439, 153513, 108952, 187944, 129632, 144079, 130300, 100885, 141705, 122060, 
            118267, 149483, 85208, 113607, 139572, 180891, 132165, 128521, 132093, 129758, 
            114198, 146017, 140837, 168823, 153987, 117581, 103995, 151460, 138363, 101134, 
            130566, 166154, 135318, 124783, 133708, 87154, 137969, 180890, 150170, 139339
        ];

        // تحميل المحفوظات من LocalStorage للربط التلقائي
        let savedExclusions = JSON.parse(localStorage.getItem('slax_excluded_ids')) || [];
        let excludedIds = Array.from(new Set([...initialExcluded, ...savedExclusions]));
        let currentFetchedList = [];
        let activeTitleForCopy = '';

        function updateBadge() {
            document.getElementById('excludedCount').innerText = `المستبعدة: ${excludedIds.length}`;
            localStorage.setItem('slax_excluded_ids', JSON.stringify(excludedIds));
        }

        async function fetchUniqueManhwa() {
            const btn = document.getElementById('loadBtn');
            btn.innerText = "جاري الجلب...";
            btn.disabled = true;

            const query = `
            query GetMassiveManhwa($excluded: [Int]) {
              Page(page: 1, perPage: 40) {
                media(type: MANGA, countryOfOrigin: "KR", sort: POPULARITY_DESC, id_not_in: $excluded) {
                  id
                  title { english romaji }
                  coverImage { large }
                  averageScore
                  genres
                  description(asHtml: false)
                }
              }
            }`;

            try {
                const response = await fetch('https://graphql.anilist.co', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        query: query,
                        variables: { excluded: excludedIds }
                    })
                });

                const result = await response.json();
                const mediaList = result.data.Page.media;

                if (!mediaList || mediaList.length === 0) {
                    document.getElementById('manhwaGrid').innerHTML = '<p>تم عرض جميع المانهوات المتاحة!</p>';
                    btn.innerText = "لا توجد نتائج جديدة";
                    return;
                }

                currentFetchedList = mediaList;
                renderCards(mediaList);

                // إضافة المعروض إلى قائمة الاستبعاد فوراً
                mediaList.forEach(item => excludedIds.push(item.id));
                updateBadge();

                btn.innerText = "عرض مانهوات جديدة ➔";
                btn.disabled = false;

            } catch (err) {
                console.error(err);
                btn.innerText = "حدث خطأ!";
                btn.disabled = false;
            }
        }

        function renderCards(list) {
            const grid = document.getElementById('manhwaGrid');
            grid.innerHTML = '';

            list.forEach(item => {
                const title = item.title.english || item.title.romaji;
                const score = item.averageScore ? (item.averageScore / 10).toFixed(1) : 'N/A';
                const mainGenre = item.genres ? item.genres.slice(0, 2).join(', ') : 'Manhwa';

                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => openModal(item);
                card.innerHTML = `
                    <img src="${item.coverImage.large}" alt="${title}" loading="lazy">
                    <div class="card-info">
                        <div class="card-title" title="${title}">${title}</div>
                        <div class="card-meta">
                            <span class="score">⭐ ${score}</span>
                            <span class="genres">${mainGenre}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterLocalResults() {
            const term = document.getElementById('searchInput').value.toLowerCase();
            const filtered = currentFetchedList.filter(item => {
                const t = (item.title.english || item.title.romaji).toLowerCase();
                return t.includes(term);
            });
            renderCards(filtered);
        }

        function openModal(item) {
            const title = item.title.english || item.title.romaji;
            activeTitleForCopy = title;

            document.getElementById('modalImg').src = item.coverImage.large;
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalScore').innerText = `⭐ ${item.averageScore ? (item.averageScore / 10).toFixed(1) : 'N/A'}`;
            document.getElementById('modalGenres').innerText = item.genres ? item.genres.join(', ') : 'Manhwa';
            document.getElementById('modalDesc').innerText = item.description || 'لا يوجد وصف متوفر لهذه المانهوا.';
            document.getElementById('searchGoogleBtn').href = `https://www.google.com/search?q=${encodeURIComponent(title + ' manhwa')}`;

            document.getElementById('modalOverlay').classList.add('active');
        }

        function closeModal(e) {
            document.getElementById('modalOverlay').classList.remove('active');
        }

        function copyTitle() {
            navigator.clipboard.writeText(activeTitleForCopy);
            alert(`تم نسخ: "${activeTitleForCopy}"`);
        }

        function resetExclusions() {
            if (confirm("هل تريد إعادة ضبط قائمة الاستبعاد إلى الـ 100 مانهوا الأساسية فقط؟")) {
                localStorage.removeItem('slax_excluded_ids');
                excludedIds = [...initialExcluded];
                updateBadge();
                fetchUniqueManhwa();
            }
        }

        // التشغيل التلقائي
        updateBadge();
        fetchUniqueManhwa();
    </script>
</body>
</html>
