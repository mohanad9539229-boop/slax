<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLAX MANHWA - ANILIST LIVE</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #09090c;
            --card-bg: #121217;
            --accent-color: #ff2a4b;
            --border-color: #1f1f28;
            --selected-color: #00ff88;
            --text-color: #ffffff;
            --text-dim: #8e8e9e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); min-height: 100vh; padding: 2rem 1rem; }
        
        header { text-align: center; margin-bottom: 2rem; }
        header h1 { font-size: 2.5rem; font-weight: 900; }
        header h1 span { color: var(--accent-color); }

        .results-grid {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.2rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
            cursor: pointer;
            transition: transform 0.2s ease, border-color 0.2s ease;
        }

        .card:hover { transform: translateY(-4px); border-color: var(--accent-color); }
        .card.selected { border-color: var(--selected-color) !important; }

        .card-img-wrapper { width: 100%; height: 280px; background-color: #181820; }
        .card img { width: 100%; height: 100%; object-fit: cover; }

        .card-content { padding: 0.8rem; display: flex; flex-direction: column; gap: 0.4rem; }
        .card-title { font-size: 0.9rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .card-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; }
        .score { color: #ffd700; font-weight: bold; }
        .genre { color: var(--text-dim); background: rgba(255,255,255,0.05); padding: 2px 6px; border-radius: 4px; font-size: 0.7rem; }
        
        .loading { text-align: center; font-size: 1.2rem; color: var(--text-dim); margin-top: 3rem; }
    </style>
</head>
<body>

    <header>
        <h1>SLAX <span>ANILIST API</span></h1>
        <p>بيانات حقيقية وبث مباشر من AniList GraphQL</p>
    </header>

    <div class="results-grid" id="resultsGrid">
        <div class="loading">جاري جلب بيانات المانهوا المباشرة...</div>
    </div>

    <script>
        // دالة جلب البيانات من AniList مباشرة
        async function fetchManhwa() {
            const query = `
            query {
              Page(page: 1, perPage: 20) {
                media(type: MANGA, countryOfOrigin: "KR", sort: SCORE_DESC) {
                  id
                  title { english romaji }
                  coverImage { large }
                  averageScore
                  genres
                }
              }
            }`;

            try {
                const response = await fetch('https://graphql.anilist.co', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                    body: JSON.stringify({ query })
                });

                const result = await response.json();
                renderCards(result.data.Page.media);
            } catch (error) {
                document.getElementById('resultsGrid').innerHTML = '<div class="loading">حدث خطأ أثناء تحميل البيانات!</div>';
            }
        }

        // دالة عرض البطاقات ببيانات الـ JSON المرجعة
        function renderCards(manhwaList) {
            const grid = document.getElementById('resultsGrid');
            grid.innerHTML = '';

            manhwaList.forEach(item => {
                const title = item.title.english || item.title.romaji;
                const cover = item.coverImage.large;
                const score = item.averageScore ? (item.averageScore / 10).toFixed(1) : 'N/A';
                const genre = item.genres[0] || 'Manhwa';

                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <div class="card-img-wrapper">
                        <img src="${cover}" alt="${title}" loading="lazy">
                    </div>
                    <div class="card-content">
                        <div class="card-title" title="${title}">${title}</div>
                        <div class="card-meta">
                            <span class="score">⭐ ${score}</span>
                            <span class="genre">${genre}</span>
                        </div>
                    </div>
                `;

                card.onclick = () => card.classList.toggle('selected');
                grid.appendChild(card);
            });
        }

        window.onload = fetchManhwa;
    </script>
</body>
</html>
