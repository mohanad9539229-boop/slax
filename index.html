<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SLAX Manhwa Hub v3.1</title>
    <style>
        :root {
            --bg-color: #0d0d12;
            --card-bg: #15151d;
            --accent-color: #ff2a4b;
            --accent-hover: #d91e3d;
            --border-color: #232330;
            --text-color: #ffffff;
            --text-dim: #9a9ab0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 1.5rem 0.8rem; text-align: center; min-height: 100vh; }

        .container { max-width: 1200px; margin: 0 auto; }
        
        header { margin-bottom: 1.5rem; }
        h1 { font-size: 2rem; font-weight: 800; letter-spacing: 1px; }
        h1 span { color: var(--accent-color); }
        p.sub { color: var(--text-dim); margin-top: 0.3rem; font-size: 0.85rem; }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            align-items: center;
            margin-bottom: 1.5rem;
            padding: 0 0.5rem;
        }

        input[type="text"] {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            outline: none;
            width: 100%;
            max-width: 280px;
            font-size: 0.9rem;
            text-align: right;
        }

        input[type="text"]:focus { border-color: var(--accent-color); }

        .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 0.75rem 1.4rem;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-decoration: none;
        }

        .btn:hover { background-color: var(--accent-hover); }
        .btn:disabled { background-color: #2a2a38; color: #666; cursor: not-allowed; }
        .btn-outline { background: transparent; border: 1px solid var(--border-color); color: var(--text-dim); }
        .btn-outline:hover { background: var(--card-bg); color: #fff; }

        .counter-badge {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            color: var(--text-dim);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 1rem;
        }

        @media (min-width: 600px) {
            .grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            text-align: right;
            transition: transform 0.2s ease, border-color 0.2s ease;
            cursor: pointer;
        }

        .card:hover { transform: translateY(-3px); border-color: var(--accent-color); }
        .card img { width: 100%; height: 220px; object-fit: cover; background: #1a1a24; }
        .card-info { padding: 0.7rem; display: flex; flex-direction: column; gap: 0.3rem; }
        .card-title { font-size: 0.85rem; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
        }

        .score { color: #ffd700; font-weight: bold; }
        .genres { font-size: 0.7rem; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Modal / النافذة المنبثقة */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(6px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            padding: 1rem;
        }

        .modal-overlay.active { display: flex; }

        .modal {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            max-width: 550px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            text-align: right;
            padding: 1.2rem;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            animation: popIn 0.25s ease;
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-close {
            position: absolute;
            top: 0.8rem; left: 0.8rem;
            background: transparent;
            border: none;
            color: var(--text-dim);
            font-size: 1.6rem;
            cursor: pointer;
            line-height: 1;
        }

        .modal-header { display: flex; gap: 1rem; margin-bottom: 1rem; }
        .modal-header img { width: 110px; height: 155px; object-fit: cover; border-radius: 8px; flex-shrink: 0; }
        .modal-details { display: flex; flex-direction: column; gap: 0.4rem; justify-content: center; }
        .modal-title { font-size: 1.1rem; font-weight: bold; color: #fff; line-height: 1.3; }
        .modal-desc { font-size: 0.85rem; color: var(--text-dim); line-height: 1.5; margin-bottom: 1rem; max-height: 140px; overflow-y: auto; padding-right: 5px; }

        .modal-actions { display: flex; gap: 8px; flex-wrap: wrap; }

        /* Toast الإشعارات */
        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background-color: var(--accent-color);
            color: #fff;
            padding: 0.7rem 1.5rem;
            border-radius: 25px;
            font-size: 0.85rem;
            font-weight: bold;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            transition: transform 0.3s ease;
            z-index: 100000;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>SLAX <span>MANHWA HUB</span></h1>
            <p class="sub">عرض 50 مانهوا جديدة بدون تكرار مع كافة الميزات التفاعلية</p>
        </header>
        
        <div class="controls">
            <input type="text" id="searchInput" placeholder="بحث بالاسم في الصفحة..." oninput="filterLocalResults()">
            <button class="btn" id="loadBtn" onclick="fetchUniqueManhwa()">عرض 50 مانهوا جديدة ➔</button>

            <button class="btn btn-outline" onclick="resetExclusions()">إعادة ضبط القائمة</button>
            <div class="counter-badge" id="excludedCount">المستبعدة: 0</div>
        </div>

        <div class="grid" id="manhwaGrid"></div>
    </div>

    <!-- Modal التفاصيل -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModal()">
        <div class="modal" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <div class="modal-header">
                <img id="modalImg" src="" alt="Cover">
                <div class="modal-details">
                    <div class="modal-title" id="modalTitle">اسم المانهوا</div>
                    <div class="score" id="modalScore">⭐ 0.0</div>
                    <div class="genres" id="modalGenres">التصنيف</div>
                </div>
            </div>
            <div class="modal-desc" id="modalDesc">الوصف غير متوفر حالياً.</div>
            <div class="modal-actions">
                <button class="btn" onclick="copyTitle()">📋 نسخ الاسم</button>
                <a id="searchGoogleBtn" target="_blank" class="btn btn-outline">🔍 بحث في Google</a>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast">تم النسخ بنجاح!</div>

    <script>
        // قائمة الـ 100 مانهوا المستبعدة بالكامل
        const initialExcluded = [
            136331, 137304, 117540, 130870, 97897, 115000, 151025, 103156, 137595, 119276, 
            177706, 113666, 130429, 141007, 120385, 116506, 175262, 75275, 117536, 52651, 
            116382, 150836, 114542, 182066, 153432, 85155, 128882, 130149, 113488, 130229, 
            170894, 60079, 173020, 110605, 141958, 113055, 129210, 141013, 153880, 178379, 
            136204, 124577, 121565, 155485, 111075, 110042, 167834, 107720, 164857, 107918,
            141479, 120440, 165182, 107518, 165287, 85869, 110472, 123739, 175946, 119363, 
            159439, 153513, 108952, 187944, 129632, 144079, 130300, 100885, 141705, 122060, 
            118267, 149483, 85208, 113607, 139572, 180891, 132165, 128521, 132093, 129758, 
            114198, 146017, 140837, 168823, 153987, 117581, 103995, 151460, 138363, 101134, 
            130566, 166154, 135318, 124783, 133708, 87154, 137969, 180890, 150170, 139339
        ];

        let savedExclusions = JSON.parse(localStorage.getItem('slax_excluded_ids')) || [];
        let excludedIds = Array.from(new Set([...initialExcluded, ...savedExclusions]));
        let currentFetchedList = [];
        let activeTitleForCopy = '';
        let pageNumber = 1;

        function updateBadge() {
            document.getElementById('excludedCount').innerText = `المستبعدة: ${excludedIds.length}`;
            localStorage.setItem('slax_excluded_ids', JSON.stringify(excludedIds));
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        async function fetchUniqueManhwa() {
            const btn = document.getElementById('loadBtn');
            btn.innerText = "جاري الجلب...";
            btn.disabled = true;

            // تحديد perPage بشكل صريح داخل المتغيرات لضمان جلب 50 مانهوا
            const query = `
            query GetMassiveManhwa($page: Int, $perPage: Int, $excluded: [Int]) {
              Page(page: $page, perPage: $perPage) {
                media(type: MANGA, countryOfOrigin: "KR", sort: POPULARITY_DESC, id_not_in: $excluded) {
                  id
                  title { english romaji }
                  coverImage { large }
                  averageScore
                  genres
                  description
                }
              }
            }`;

            try {
                const response = await fetch('https://graphql.anilist.co', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        query: query,
                        variables: { 
                            page: 1, 
                            perPage: 50, // إجبار السيرفر على إرجاع 50 مانهوا
                            excluded: excludedIds 
                        }
                    })
                });

                const result = await response.json();
                
                if (!result.data || !result.data.Page || !result.data.Page.media) {
                    throw new Error("Invalid API Response");
                }

                const mediaList = result.data.Page.media;

                if (mediaList.length === 0) {
                    document.getElementById('manhwaGrid').innerHTML = '<p style="grid-column: 1/-1;">تم عرض جميع المانهوات المتاحة!</p>';
                    btn.innerText = "لا توجد نتائج جديدة";
                    return;
                }

                currentFetchedList = mediaList;
                renderCards(mediaList);

                // إضافة المعروض إلى مصفوفة الاستبعاد
                mediaList.forEach(item => {
                    if(!excludedIds.includes(item.id)) excludedIds.push(item.id);
                });
                updateBadge();

                btn.innerText = "عرض 50 مانهوا جديدة ➔";
                btn.disabled = false;

            } catch (err) {
                console.error(err);
                btn.innerText = "حدث خطأ، اضغط لإعادة المحاولة";
                btn.disabled = false;
            }
        }

        function renderCards(list) {
            const grid = document.getElementById('manhwaGrid');
            grid.innerHTML = '';

            list.forEach(item => {
                const title = item.title.english || item.title.romaji;
                const score = item.averageScore ? (item.averageScore / 10).toFixed(1) : 'N/A';
                const mainGenre = item.genres && item.genres.length > 0 ? item.genres.slice(0, 2).join(', ') : 'Manhwa';

                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => openModal(item);
                card.innerHTML = `
                    <img src="${item.coverImage.large}" alt="${title}" loading="lazy">
                    <div class="card-info">
                        <div class="card-title" title="${title}">${title}</div>
                        <div class="card-meta">
                            <span class="score">⭐ ${score}</span>
                            <span class="genres">${mainGenre}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function filterLocalResults() {
            const term = document.getElementById('searchInput').value.toLowerCase().trim();
            const filtered = currentFetchedList.filter(item => {
                const englishTitle = (item.title.english || '').toLowerCase();
                const romajiTitle = (item.title.romaji || '').toLowerCase();
                return englishTitle.includes(term) || romajiTitle.includes(term);
            });
            renderCards(filtered);
        }

        function openModal(item) {
            const title = item.title.english || item.title.romaji;
            activeTitleForCopy = title;

            // تنظيف الوصف من نصوص HTML
            let cleanDesc = item.description || 'لا يوجد وصف متوفر لهذه المانهوا.';
            cleanDesc = cleanDesc.replace(/<[^>]*>?/gm, '');

            document.getElementById('modalImg').src = item.coverImage.large;
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalScore').innerText = `⭐ ${item.averageScore ? (item.averageScore / 10).toFixed(1) : 'N/A'}`;
            document.getElementById('modalGenres').innerText = item.genres ? item.genres.join(', ') : 'Manhwa';
            document.getElementById('modalDesc').innerText = cleanDesc;
            document.getElementById('searchGoogleBtn').href = `https://www.google.com/search?q=${encodeURIComponent(title + ' manhwa')}`;

            document.getElementById('modalOverlay').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
        }

        // دالة نسخ تعمل على جميع الأجهزة
        function copyTitle() {
            if (!activeTitleForCopy) return;

            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(activeTitleForCopy).then(() => {
                    showToast("تم نسخ الاسم بنجاح!");
                }).catch(() => fallbackCopy(activeTitleForCopy));
            } else {
                fallbackCopy(activeTitleForCopy);
            }
        }

        function fallbackCopy(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.left = "-9999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                showToast("تم نسخ الاسم بنجاح!");
            } catch (err) {
                alert("اسم المانهوا: " + text);
            }
            document.body.removeChild(textArea);
        }

        function resetExclusions() {
            if (confirm("هل تريد إعادة ضبط قائمة الاستبعاد وإلغاء المحفوظات؟")) {
                localStorage.removeItem('slax_excluded_ids');
                excludedIds = [...initialExcluded];
                updateBadge();
                fetchUniqueManhwa();
            }
        }

        // التشغيل التلقائي
        updateBadge();
        fetchUniqueManhwa();
    </script>
</body>
</html>
