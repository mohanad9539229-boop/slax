<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLAX MANHWA AI - 100K EDITION</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #09090c;
            --card-bg: #121217;
            --accent-color: #ff2a4b;
            --accent-gradient: linear-gradient(135deg, #ff2a4b, #ff758c);
            --border-color: #1f1f28;
            --border-hover: rgba(255, 42, 75, 0.5);
            --selected-color: #00ff88;
            --text-color: #ffffff;
            --text-dim: #8e8e9e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem 5rem 1rem;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        header h1 {
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: -1px;
        }

        header h1 span {
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: var(--text-dim);
            margin-top: 0.5rem;
            font-size: 1rem;
        }

        .search-container {
            width: 100%;
            max-width: 700px;
            display: flex;
            gap: 12px;
            margin-bottom: 1.5rem;
        }

        select, button {
            padding: 0.85rem 1.2rem;
            border-radius: 10px;
            font-size: 1rem;
            border: 1px solid var(--border-color);
            outline: none;
        }

        select {
            flex: 1;
            background-color: var(--card-bg);
            color: var(--text-color);
            cursor: pointer;
            transition: border-color 0.2s ease;
        }

        select:focus {
            border-color: var(--accent-color);
        }

        button {
            background: var(--accent-gradient);
            color: white;
            font-weight: bold;
            cursor: pointer;
            border: none;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        button:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .selection-bar {
            width: 100%;
            max-width: 1200px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 0.9rem 1.4rem;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.8rem;
            backdrop-filter: blur(10px);
        }

        .selection-count {
            font-weight: bold;
            color: var(--selected-color);
            font-size: 1.1rem;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            font-size: 0.85rem;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .results-grid {
            width: 100%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 1.4rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            position: relative;
            user-select: none;
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.25s ease, box-shadow 0.25s ease;
            contain: content;
        }

        .card:hover {
            border-color: var(--border-hover);
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(255, 42, 75, 0.15);
        }

        .card.selected {
            border-color: var(--selected-color) !important;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.25) !important;
        }

        .card-checkbox {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 26px;
            height: 26px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            color: transparent;
            z-index: 3;
            transition: all 0.2s ease;
        }

        .card.selected .card-checkbox {
            background: var(--selected-color);
            border-color: var(--selected-color);
            color: #000;
            font-weight: bold;
        }

        .card-img-wrapper {
            width: 100%;
            height: 270px;
            background-color: #181820;
            position: relative;
            overflow: hidden;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
        }

        .card:hover img {
            transform: scale(1.04);
        }

        .card-content {
            padding: 0.9rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
            gap: 0.5rem;
        }

        .card-title {
            font-size: 0.95rem;
            font-weight: 700;
            line-height: 1.35;
            color: #efefef;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 0.2rem;
        }

        .card-score {
            color: #ffd700;
            font-size: 0.85rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .card-id {
            font-size: 0.75rem;
            color: var(--text-dim);
            background: rgba(255, 255, 255, 0.05);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .load-more-container {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: center;
            margin-top: 2.5rem;
        }

        .load-more-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 0.9rem 2.5rem;
            width: 100%;
            max-width: 320px;
            font-size: 1rem;
            color: var(--text-color);
            border-radius: 12px;
        }

        .load-more-btn:hover {
            border-color: var(--accent-color);
        }
    </style>
</head>
<body>

    <header>
        <h1>SLAX <span>MANHWA AI</span></h1>
        <p>عملاق المانهوا الرقمي (100,000 مانهوا - سرعة صاروخية بدون تعليق)</p>
    </header>

    <div class="search-container">
        <select id="genreSelect">
            <option value="all">كل التصنيفات (100,000 مانهوا 🔥)</option>
            <option value="action">أكشن وترقية (Action & System)</option>
            <option value="fantasy">فانتازيا وسحر (Fantasy)</option>
            <option value="murim">موريم وفنون قتالية (Murim)</option>
            <option value="reincarnation">تجسد وعالم آخر (Reincarnation)</option>
            <option value="romance">رومانسي ودراما (Romance)</option>
        </select>
        <button onclick="resetAndSearch()">بحث</button>
    </div>

    <div class="selection-bar">
        <div>المحدد حالياً: <span class="selection-count" id="selectCount">0</span> مانهوا</div>
        <button class="action-btn" onclick="copySelected()">نسخ العناوين المختارة 📋</button>
    </div>

    <div class="results-grid" id="resultsGrid"></div>

    <div class="load-more-container">
        <button class="load-more-btn" id="loadMoreBtn" onclick="loadMore()">عرض المزيد ⬇️</button>
    </div>

    <script>
        const baseTitles = {
            action: [
                "Solo Leveling", "Omniscient Reader's Viewpoint", "Legend of the Northern Blade", 
                "Eleceed", "Nano Machine", "Infinite Leveling in the Murim", "The Breaker", 
                "Pick Me Up! Infinite Gacha", "Kill the Hero", "Doom Breaker", "Superhuman Era", 
                "Leveling With the Gods", "Tower of God", "The God of High School", "Mercenary Enrollment", 
                "Study Group", "Castle", "Manager Kim", "Lookism", "Viral Hit", "Reality Quest", 
                "Quest Supremacy", "Hanlim Gym", "Juvenile Offender", "God of Blackfield"
            ],
            fantasy: [
                "The Beginning After The End", "The Greatest Estate Developer", "The S-Ranks That I Raised", 
                "Overgeared", "Hardcore Leveling Warrior", "Second Life Ranker", "The Archmage Returns After 4000 Years", 
                "Magic Emperor", "Survival Story of a Sword King", "The Skeleton Soldier Failed to Defend the Dungeon",
                "A Returner's Magic Should Be Special", "Trash of the Count's Family", "Dungeon House",
                "I Am the Fated Villain", "Solo Max-Level Newbie", "Ranker Who Lives a Second Time", 
                "The Player That Can't Level Up", "The Lone Necromancer", "Tomb Raider King", "The Novel's Extra"
            ],
            murim: [
                "Return of the Mount Hua Sect", "Volcanic Age", "Wandering Warrior of Wudang", 
                "Gosu", "Peerless Dad", "Murim Login", "Reaper of the Drifting Moon", 
                "Chronicles of Heavenly Demon", "Legend of Asura - The Venom Dragon", "Demon in Mount Hua",
                "The Heavenly Demon Can’t Live a Normal Life", "Memoirs of the King of War", "Master of Lightning Knives",
                "Champion's Path to Murim", "Poison Dragon: Legend of an Asura", "Infinite Leveling Murim",
                "Bowblade Spirit", "Star Instructor, Master Baek", "Absolute Sword Sense"
            ],
            reincarnation: [
                "Damn Reincarnation", "Doctor’s Rebirth", "Past Life Regressor", "Reborn Rich", 
                "The Dark Magician Transmigrates After 66666 Years", "Reincarnation of the Suicidal Battle God", 
                "Academy’s Undercover Professor", "Swordmaster’s Youngest Son", "The Lord’s Coins Aren’t Decreasing!",
                "Standard of Reincarnation", "Real Man", "I Shall Live As a Prince", "Infinite Mage",
                "Reborn as the Enemy Prince", "The Lazy Lord Masters the Sword", "I Regressed As The Duke"
            ],
            romance: [
                "Villains Are Destined to Die", "A Business Proposal", "Who Made Me a Princess", 
                "The Remarried Empress", "Light and Shadow", "My In-Laws Are Obsessed With Me", 
                "Father, I Don't Want this Marriage!", "Secret Playlist", "Unholy Blood", "True Beauty",
                "How to Get My Husband on My Side", "Beware the Villainess!", "See You in My 19th Life",
                "I Shall Master This Family", "Death Is the Only Ending for the Villainess", "Operating Room Romance"
            ]
        };

        const TOTAL_COUNT = 100000;
        const genres = Object.keys(baseTitles);

        // توليد البطاقة ديناميكياً فقط لحظة الطلب لتجنب استهلاك الرام
        function getItem(index) {
            const genre = genres[index % genres.length];
            const list = baseTitles[genre];
            const baseTitle = list[index % list.length];
            const cycle = Math.floor(index / (genres.length * list.length));
            const title = cycle === 0 ? baseTitle : `${baseTitle} (Part ${cycle + 1})`;
            const score = (8.0 + ((index * 13) % 20) / 10).toFixed(1);
            
            return {
                id: index + 1,
                title: title,
                genre: genre,
                score: score,
                img: getDynamicCover(title, genre, index + 1)
            };
        }

        function getDynamicCover(title, genre, id) {
            const themes = {
                action: { bg1: '#8a0000', bg2: '#140003', accent: '#ff334b', name: 'ACTION' },
                fantasy: { bg1: '#3b008a', bg2: '#080017', accent: '#a855f7', name: 'FANTASY' },
                murim: { bg1: '#7a5200', bg2: '#140d00', accent: '#eab308', name: 'MURIM' },
                reincarnation: { bg1: '#005f73', bg2: '#001219', accent: '#06b6d4', name: 'REINCARNATION' },
                romance: { bg1: '#8a004b', bg2: '#17000d', accent: '#ec4899', name: 'ROMANCE' }
            };

            const t = themes[genre] || themes.action;

            const svg = `
            <svg xmlns="http://www.w3.org/2000/svg" width="210" height="270" viewBox="0 0 210 270">
                <defs>
                    <linearGradient id="bg_${id}" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="${t.bg1}" />
                        <stop offset="100%" stop-color="${t.bg2}" />
                    </linearGradient>
                    <linearGradient id="overlay_${id}" x1="0%" y1="100%" x2="0%" y2="0%">
                        <stop offset="0%" stop-color="rgba(0,0,0,0.9)" />
                        <stop offset="50%" stop-color="rgba(0,0,0,0.2)" />
                        <stop offset="100%" stop-color="rgba(0,0,0,0.4)" />
                    </linearGradient>
                </defs>
                <rect width="210" height="270" fill="url(#bg_${id})" />
                <circle cx="105" cy="110" r="70" fill="${t.accent}" opacity="0.15" />
                <rect width="210" height="270" fill="url(#overlay_${id})" />
                <rect x="8" y="8" width="194" height="254" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" rx="10" />
                <rect x="15" y="15" width="85" height="20" rx="10" fill="rgba(255,255,255,0.12)" backdrop-filter="blur(5px)" />
                <text x="57.5" y="29" font-family="'Tajawal', sans-serif" font-size="9" fill="#fff" font-weight="900" text-anchor="middle">${t.name}</text>
                <text x="105" y="130" font-family="'Tajawal', sans-serif" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="middle">
                    <tspan x="105" dy="0">${title.substring(0, 20)}</tspan>
                    <tspan x="105" dy="17">${title.length > 20 ? title.substring(20, 40) : ''}</tspan>
                </text>
            </svg>`;

            return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
        }

        let selectedList = new Set();
        let currentPage = 1;
        const itemsPerPage = 28;
        let activeFilter = 'all';

        function resetAndSearch() {
            currentPage = 1;
            document.getElementById('resultsGrid').innerHTML = '';
            activeFilter = document.getElementById('genreSelect').value;
            renderPage();
        }

        function renderPage() {
            const resultsGrid = document.getElementById('resultsGrid');
            const fragment = document.createDocumentFragment();

            let renderedCount = 0;
            let index = (currentPage - 1) * itemsPerPage;

            while (renderedCount < itemsPerPage && index < TOTAL_COUNT) {
                const item = getItem(index);
                index++;

                if (activeFilter !== 'all' && item.genre !== activeFilter) {
                    continue;
                }

                renderedCount++;
                const card = document.createElement('div');
                card.className = 'card' + (selectedList.has(item.title) ? ' selected' : '');

                card.innerHTML = `
                    <div class="card-checkbox">✓</div>
                    <div class="card-img-wrapper">
                        <img src="${item.img}" alt="${item.title}" loading="lazy" width="210" height="270">
                    </div>
                    <div class="card-content">
                        <div class="card-title">${item.title}</div>
                        <div class="card-meta">
                            <span class="card-score">⭐ ${item.score}</span>
                            <span class="card-id">#${item.id}</span>
                        </div>
                    </div>
                `;

                card.onclick = () => {
                    if (selectedList.has(item.title)) {
                        selectedList.delete(item.title);
                        card.classList.remove('selected');
                    } else {
                        selectedList.add(item.title);
                        card.classList.add('selected');
                    }
                    updateCount();
                };

                fragment.appendChild(card);
            }

            resultsGrid.appendChild(fragment);

            const loadMoreBtn = document.getElementById('loadMoreBtn');
            if (index >= TOTAL_COUNT) {
                loadMoreBtn.style.display = 'none';
            } else {
                loadMoreBtn.style.display = 'block';
            }
        }

        function loadMore() {
            currentPage++;
            renderPage();
        }

        function updateCount() {
            document.getElementById('selectCount').innerText = selectedList.size;
        }

        function copySelected() {
            if (selectedList.size === 0) {
                alert('لم تقم بتحديد أي مانهوا بعد!');
                return;
            }
            const textToCopy = Array.from(selectedList).join('\n');
            navigator.clipboard.writeText(textToCopy);
            alert(`تم نسخ (${selectedList.size}) مانهوا إلى الحافظة بنجاح!`);
        }

        window.onload = resetAndSearch;
    </script>
</body>
</html>
