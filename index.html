<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLAX MANHWA AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0b0e;
            --card-bg: #141419;
            --accent-color: #ff2a4b;
            --accent-hover: #d91b3a;
            --text-color: #ffffff;
            --text-dim: #a0a0a0;
            --border-color: #23232c;
            --selected-border: #00ff88;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem 5rem 1rem;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 900;
            letter-spacing: 1px;
        }

        header h1 span {
            color: var(--accent-color);
        }

        header p {
            color: var(--text-dim);
            margin-top: 0.5rem;
        }

        .search-container {
            width: 100%;
            max-width: 650px;
            display: flex;
            gap: 10px;
            margin-bottom: 1.5rem;
        }

        select, button {
            padding: 0.8rem 1.2rem;
            border-radius: 8px;
            font-size: 1rem;
            border: 1px solid var(--border-color);
            outline: none;
        }

        select {
            flex: 1;
            background-color: var(--card-bg);
            color: var(--text-color);
            cursor: pointer;
        }

        button {
            background-color: var(--accent-color);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        /* Selection Controls Bar */
        .selection-bar {
            width: 100%;
            max-width: 1100px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 0.8rem 1.2rem;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .selection-count {
            font-weight: bold;
            color: var(--selected-border);
        }

        .action-btn {
            background: #22222b;
            font-size: 0.85rem;
            padding: 0.5rem 1rem;
            border-radius: 6px;
        }

        .results-grid {
            width: 100%;
            max-width: 1100px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 1.2rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            position: relative;
            user-select: none;
            transition: all 0.2s ease;
        }

        .card:hover {
            border-color: var(--accent-color);
        }

        .card.selected {
            border-color: var(--selected-border) !important;
            box-shadow: 0 0 12px rgba(0, 255, 136, 0.2);
        }

        .card-checkbox {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 24px;
            height: 24px;
            background: rgba(0,0,0,0.8);
            border: 2px solid var(--border-color);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            color: transparent;
            z-index: 2;
        }

        .card.selected .card-checkbox {
            background: var(--selected-border);
            border-color: var(--selected-border);
            color: #000;
            font-weight: bold;
        }

        .card img {
            width: 100%;
            height: 280px;
            object-fit: cover;
        }

        .card-content {
            padding: 0.8rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
        }

        .card-title {
            font-size: 0.95rem;
            font-weight: 700;
            margin-bottom: 0.4rem;
            line-height: 1.3;
        }

        .card-score {
            color: #ffd700;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .status-msg {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--text-dim);
            font-size: 1.2rem;
            margin-top: 2rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>SLAX <span>MANHWA AI</span></h1>
        <p>مستكشف المانهوا الذكي - اختر التصنيف واختَر عدة أعمال في وقت واحد</p>
    </header>

    <div class="search-container">
        <select id="genreSelect">
            <option value="all">كل التصنيفات (الأعلى تقييماً)</option>
            <option value="action">Action (أكشن)</option>
            <option value="fantasy">Fantasy (فانتازيا)</option>
            <option value="adventure">Adventure (مغامرة)</option>
            <option value="system">System / Leveling (أنظمة وترقية)</option>
            <option value="romance">Romance (رومانسي)</option>
            <option value="reincarnation">Reincarnation / Isekai (تجسد/انتقال)</option>
            <option value="comedy">Comedy (كوميديا)</option>
            <option value="drama">Drama (دراما)</option>
        </select>
        <button onclick="searchManhwa()">بحث الان</button>
    </div>

    <div class="selection-bar">
        <div>المحدد حالياً: <span class="selection-count" id="selectCount">0</span> مانهوا</div>
        <button class="action-btn" onclick="copySelected()">نسخ العناوين المختارة 📋</button>
    </div>

    <div class="results-grid" id="resultsGrid">
        <div class="status-msg">اضغط على زر البحث للبدء...</div>
    </div>

    <script>
        let selectedList = new Set();

        async function searchManhwa() {
            const genre = document.getElementById('genreSelect').value;
            const resultsGrid = document.getElementById('resultsGrid');

            resultsGrid.innerHTML = '<div class="status-msg">جاري استخراج المانهوا... ⏳</div>';
            selectedList.clear();
            updateCount();

            // بناء رابط الاستعلام المباشر المرن دون تعقيدات معرفات التصنيف الحادة
            let queryUrl = `https://api.jikan.moe/v4/manga?type=manhwa&order_by=score&sort=desc&limit=24`;
            
            if (genre !== 'all') {
                queryUrl += `&q=${genre}`;
            }

            try {
                const response = await fetch(queryUrl);
                const data = await response.json();

                if (!data.data || data.data.length === 0) {
                    resultsGrid.innerHTML = '<div class="status-msg">لم يتم العثور على مانهوا لهذا التصنيف، حاول اختيار تصنيف آخر.</div>';
                    return;
                }

                resultsGrid.innerHTML = '';

                data.data.forEach(item => {
                    const title = item.title_english || item.title || 'عنوان غير معروف';
                    const image = item.images?.jpg?.large_image_url || 'https://via.placeholder.com/225x350';
                    const score = item.score ? `⭐ ${item.score}` : 'بدون تقييم';

                    const card = document.createElement('div');
                    card.className = 'card';
                    card.setAttribute('data-title', title);

                    card.innerHTML = `
                        <div class="card-checkbox">✓</div>
                        <img src="${image}" alt="${title}" loading="lazy">
                        <div class="card-content">
                            <div class="card-title">${title}</div>
                            <div class="card-score">${score}</div>
                        </div>
                    `;

                    // ميزة التحديد المتعدد بالنقر
                    card.onclick = () => {
                        if (selectedList.has(title)) {
                            selectedList.delete(title);
                            card.classList.remove('selected');
                        } else {
                            selectedList.add(title);
                            card.classList.add('selected');
                        }
                        updateCount();
                    };

                    resultsGrid.appendChild(card);
                });

            } catch (error) {
                console.error(error);
                resultsGrid.innerHTML = '<div class="status-msg">حدث خطأ في جلب البيانات، يرجى إعادة المحاولة.</div>';
            }
        }

        function updateCount() {
            document.getElementById('selectCount').innerText = selectedList.size;
        }

        function copySelected() {
            if (selectedList.size === 0) {
                alert('لم تقم بتحديد أي مانهوا بعد!');
                return;
            }
            const textToCopy = Array.from(selectedList).join('\n');
            navigator.clipboard.writeText(textToCopy);
            alert(`تم نسخ (${selectedList.size}) مانهوا إلى الحافظة بنجاح!`);
        }

        // تشغيل بحث تلقائي عند التحميل الأول
        window.onload = searchManhwa;
    </script>
</body>
</html>
