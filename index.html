<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLAX Unique Manhwa Hub</title>
    <style>
        :root {
            --bg-color: #0d0d12;
            --card-bg: #15151d;
            --accent-color: #ff2a4b;
            --border-color: #232330;
            --text-color: #ffffff;
            --text-dim: #9a9ab0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 2rem 1rem; text-align: center; }

        .container { max-width: 1200px; margin: 0 auto; }
        h1 { font-size: 2rem; margin-bottom: 0.5rem; }
        h1 span { color: var(--accent-color); }
        p.sub { color: var(--text-dim); margin-bottom: 1.5rem; font-size: 0.9rem; }

        .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 0.9rem 2rem;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
            margin-bottom: 2rem;
        }

        .btn:hover { opacity: 0.85; }
        .btn:disabled { background-color: #333; color: #666; cursor: not-allowed; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 1.2rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            text-align: right;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card img { width: 100%; height: 240px; object-fit: cover; background: #1a1a24; }
        .card-info { padding: 0.7rem; display: flex; flex-direction: column; gap: 0.3rem; }
        .card-title { font-size: 0.85rem; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .score { color: #ffd700; font-size: 0.8rem; }
        .genres { font-size: 0.75rem; color: var(--text-dim); }
    </style>
</head>
<body>

    <div class="container">
        <h1>SLAX <span>MANHWA DISCOVERY</span></h1>
        <p class="sub">يتم استبعاد المانهوات السابقة تلقائياً لضمان نتائج جديدة دائماً</p>
        
        <button class="btn" id="loadBtn" onclick="fetchUniqueManhwa()">عرض مانهوات جديدة ➔</button>

        <div class="grid" id="manhwaGrid"></div>
    </div>

    <script>
        // قائمة الـ 50 مانهوا التي أرسلتها لاستبعادها نهائياً
        const excludedIds = [
            136331, 137304, 117540, 130870, 97897, 115000, 151025, 103156, 137595, 119276, 
            177706, 113666, 130429, 141007, 120385, 116506, 175262, 75275, 117536, 52651, 
            116382, 150836, 114542, 182066, 153432, 85155, 128882, 130149, 113488, 130229, 
            170894, 60079, 173020, 110605, 141958, 113055, 129210, 141013, 153880, 178379, 
            136204, 124577, 121565, 155485, 111075, 110042, 167834, 107720, 164857, 107918
        ];

        async function fetchUniqueManhwa() {
            const btn = document.getElementById('loadBtn');
            btn.innerText = "جاري جلب مانهوات جديدة...";
            btn.disabled = true;

            // نرسل مصفوفة excludedIds داخل id_not_in لتستبعدها السيرفرات مباشرة
            const query = `
            query GetMassiveManhwa($excluded: [Int]) {
              Page(page: 1, perPage: 50) {
                pageInfo {
                  hasNextPage
                  total
                }
                media(type: MANGA, countryOfOrigin: "KR", sort: POPULARITY_DESC, id_not_in: $excluded) {
                  id
                  title {
                    english
                    romaji
                  }
                  coverImage {
                    large
                  }
                  averageScore
                  genres
                }
              }
            }`;

            try {
                const response = await fetch('https://graphql.anilist.co', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        query: query,
                        variables: { excluded: excludedIds }
                    })
                });

                const result = await response.json();
                const pageData = result.data.Page;
                const mediaList = pageData.media;
                const grid = document.getElementById('manhwaGrid');

                grid.innerHTML = '';

                if (mediaList.length === 0) {
                    grid.innerHTML = '<p>لم يتم العثور على مانهوات جديدة.</p>';
                    btn.innerText = "تم عرض كل المانهوات المتاحة";
                    return;
                }

                mediaList.forEach(item => {
                    // إضافة ID المانهوا المعروضة إلى مصفوفة الاستبعاد حتى لا تظهر مجدداً
                    excludedIds.push(item.id);

                    const title = item.title.english || item.title.romaji;
                    const cover = item.coverImage.large;
                    const score = item.averageScore ? (item.averageScore / 10).toFixed(1) : 'N/A';
                    const mainGenre = item.genres[0] || 'Manhwa';

                    const card = document.createElement('div');
                    card.className = 'card';
                    card.innerHTML = `
                        <img src="${cover}" alt="${title}" loading="lazy">
                        <div class="card-info">
                            <div class="card-title" title="${title}">${title}</div>
                            <span class="score">⭐ ${score}</span>
                            <span class="genres">${mainGenre}</span>
                        </div>
                    `;
                    grid.appendChild(card);
                });

                btn.innerText = "عرض مانهوات جديدة ➔";
                btn.disabled = false;

            } catch (error) {
                console.error("Error:", error);
                btn.innerText = "حدث خطأ، حاول مجدداً";
                btn.disabled = false;
            }
        }

        // جلب الدفعة الأولى فور الفتح
        fetchUniqueManhwa();
    </script>
</body>
</html>
