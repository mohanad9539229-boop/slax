<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SLAX MANHWA - REAL DATABASE</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #09090c;
            --card-bg: #121217;
            --accent-color: #ff2a4b;
            --accent-gradient: linear-gradient(135deg, #ff2a4b, #ff758c);
            --border-color: #1f1f28;
            --border-hover: rgba(255, 42, 75, 0.5);
            --selected-color: #00ff88;
            --text-color: #ffffff;
            --text-dim: #8e8e9e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem 1rem 5rem 1rem;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        header h1 {
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: -1px;
        }

        header h1 span {
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        header p {
            color: var(--text-dim);
            margin-top: 0.5rem;
            font-size: 1rem;
        }

        .search-container {
            width: 100%;
            max-width: 700px;
            display: flex;
            gap: 12px;
            margin-bottom: 1.5rem;
        }

        input, select, button {
            padding: 0.85rem 1.2rem;
            border-radius: 10px;
            font-size: 1rem;
            border: 1px solid var(--border-color);
            outline: none;
        }

        input {
            flex: 2;
            background-color: var(--card-bg);
            color: var(--text-color);
        }

        input:focus, select:focus {
            border-color: var(--accent-color);
        }

        select {
            flex: 1;
            background-color: var(--card-bg);
            color: var(--text-color);
            cursor: pointer;
        }

        button {
            background: var(--accent-gradient);
            color: white;
            font-weight: bold;
            cursor: pointer;
            border: none;
            transition: transform 0.2s ease, opacity 0.2s ease;
        }

        button:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .selection-bar {
            width: 100%;
            max-width: 1200px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 0.9rem 1.4rem;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.8rem;
            backdrop-filter: blur(10px);
        }

        .selection-count {
            font-weight: bold;
            color: var(--selected-color);
            font-size: 1.1rem;
        }

        .action-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            font-size: 0.85rem;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
        }

        .action-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .results-grid {
            width: 100%;
            max-width: 1200px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            gap: 1.4rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            cursor: pointer;
            position: relative;
            user-select: none;
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.25s ease, box-shadow 0.25s ease;
            contain: content;
        }

        .card:hover {
            border-color: var(--border-hover);
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(255, 42, 75, 0.15);
        }

        .card.selected {
            border-color: var(--selected-color) !important;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.25) !important;
        }

        .card-checkbox {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 26px;
            height: 26px;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            color: transparent;
            z-index: 3;
            transition: all 0.2s ease;
        }

        .card.selected .card-checkbox {
            background: var(--selected-color);
            border-color: var(--selected-color);
            color: #000;
            font-weight: bold;
        }

        .card-img-wrapper {
            width: 100%;
            height: 270px;
            background-color: #181820;
            position: relative;
            overflow: hidden;
        }

        .card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
        }

        .card:hover img {
            transform: scale(1.04);
        }

        .card-content {
            padding: 0.9rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
            justify-content: space-between;
            gap: 0.5rem;
        }

        .card-title {
            font-size: 0.95rem;
            font-weight: 700;
            line-height: 1.35;
            color: #efefef;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 0.2rem;
        }

        .card-score {
            color: #ffd700;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .card-genre {
            font-size: 0.75rem;
            color: var(--text-dim);
            background: rgba(255, 255, 255, 0.05);
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <header>
        <h1>SLAX <span>REAL MANHWA</span></h1>
        <p>قائمة مانهوات حقيقية 100% وبدون أي تكرار أو أسماء وهمية</p>
    </header>

    <div class="search-container">
        <input type="text" id="searchInput" placeholder="ابحث عن مانهوا..." oninput="filterAndRender()">
        <select id="genreSelect" onchange="filterAndRender()">
            <option value="all">كل التصنيفات</option>
            <option value="action">أكشن وترقية</option>
            <option value="fantasy">فانتازيا</option>
            <option value="murim">موريم وفنون قتالية</option>
            <option value="reincarnation">تجسد وعودة بالزمن</option>
            <option value="romance">رومانسي</option>
        </select>
    </div>

    <div class="selection-bar">
        <div>المحدد حالياً: <span class="selection-count" id="selectCount">0</span> مانهوا</div>
        <button class="action-btn" onclick="copySelected()">نسخ العناوين المختارة 📋</button>
    </div>

    <div class="results-grid" id="resultsGrid"></div>

    <script>
        // قاعدة بيانات مانهوات حقيقية ومجربة 100%
        const realManhwaList = [
            // Action
            { title: "Solo Leveling", genre: "action", score: "9.8" },
            { title: "Omniscient Reader's Viewpoint", genre: "action", score: "9.7" },
            { title: "Legend of the Northern Blade", genre: "action", score: "9.6" },
            { title: "Eleceed", genre: "action", score: "9.6" },
            { title: "Nano Machine", genre: "action", score: "9.5" },
            { title: "The Breaker", genre: "action", score: "9.4" },
            { title: "Pick Me Up! Infinite Gacha", genre: "action", score: "9.3" },
            { title: "Superhuman Era", genre: "action", score: "9.5" },
            { title: "Leveling With the Gods", genre: "action", score: "9.2" },
            { title: "Tower of God", genre: "action", score: "9.4" },
            { title: "Mercenary Enrollment", genre: "action", score: "9.1" },
            { title: "Lookism", genre: "action", score: "9.2" },
            { title: "Viral Hit", genre: "action", score: "9.0" },
            { title: "Manager Kim", genre: "action", score: "9.0" },
            { title: "Reality Quest", genre: "action", score: "8.9" },
            { title: "Quest Supremacy", genre: "action", score: "8.8" },
            { title: "Castle", genre: "action", score: "9.5" },
            { title: "God of Blackfield", genre: "action", score: "8.9" },

            // Fantasy
            { title: "The Beginning After The End", genre: "fantasy", score: "9.6" },
            { title: "The Greatest Estate Developer", genre: "fantasy", score: "9.8" },
            { title: "Overgeared", genre: "fantasy", score: "9.3" },
            { title: "Second Life Ranker", genre: "fantasy", score: "9.1" },
            { title: "The S-Ranks That I Raised", genre: "fantasy", score: "9.0" },
            { title: "Survival Story of a Sword King", genre: "fantasy", score: "9.4" },
            { title: "A Returner's Magic Should Be Special", genre: "fantasy", score: "8.9" },
            { title: "Trash of the Count's Family", genre: "fantasy", score: "9.2" },
            { title: "Solo Max-Level Newbie", genre: "fantasy", score: "9.0" },
            { title: "The Novel's Extra", genre: "fantasy", score: "9.1" },
            { title: "Hardcore Leveling Warrior", genre: "fantasy", score: "9.0" },

            // Murim
            { title: "Return of the Mount Hua Sect", genre: "murim", score: "9.7" },
            { title: "Murim Login", genre: "murim", score: "9.5" },
            { title: "Gosu", genre: "murim", score: "9.4" },
            { title: "Peerless Dad", genre: "murim", score: "9.2" },
            { title: "Reaper of the Drifting Moon", genre: "murim", score: "9.3" },
            { title: "Wandering Warrior of Wudang", genre: "murim", score: "9.1" },
            { title: "Volcanic Age", genre: "murim", score: "8.9" },
            { title: "Chronicles of Heavenly Demon", genre: "murim", score: "9.2" },
            { title: "Absolute Sword Sense", genre: "murim", score: "9.0" },
            { title: "Master of Lightning Knives", genre: "murim", score: "8.8" },

            // Reincarnation
            { title: "Damn Reincarnation", genre: "reincarnation", score: "9.4" },
            { title: "Swordmaster’s Youngest Son", genre: "reincarnation", score: "9.3" },
            { title: "Academy’s Undercover Professor", genre: "reincarnation", score: "9.2" },
            { title: "Reincarnation of the Suicidal Battle God", genre: "reincarnation", score: "9.5" },
            { title: "Doctor’s Rebirth", genre: "reincarnation", score: "9.0" },
            { title: "Infinite Mage", genre: "reincarnation", score: "9.1" },
            { title: "The Lazy Lord Masters the Sword", genre: "reincarnation", score: "9.2" },

            // Romance
            { title: "Villains Are Destined to Die", genre: "romance", score: "9.6" },
            { title: "The Remarried Empress", genre: "romance", score: "9.4" },
            { title: "See You in My 19th Life", genre: "romance", score: "9.5" },
            { title: "Who Made Me a Princess", genre: "romance", score: "9.3" },
            { title: "A Business Proposal", genre: "romance", score: "9.2" },
            { title: "My In-Laws Are Obsessed With Me", genre: "romance", score: "9.3" }
        ];

        function getDynamicCover(title, genre, id) {
            const themes = {
                action: { bg1: '#8a0000', bg2: '#140003', accent: '#ff334b', name: 'ACTION' },
                fantasy: { bg1: '#3b008a', bg2: '#080017', accent: '#a855f7', name: 'FANTASY' },
                murim: { bg1: '#7a5200', bg2: '#140d00', accent: '#eab308', name: 'MURIM' },
                reincarnation: { bg1: '#005f73', bg2: '#001219', accent: '#06b6d4', name: 'REINCARNATION' },
                romance: { bg1: '#8a004b', bg2: '#17000d', accent: '#ec4899', name: 'ROMANCE' }
            };

            const t = themes[genre] || themes.action;

            const svg = `
            <svg xmlns="http://www.w3.org/2000/svg" width="210" height="270" viewBox="0 0 210 270">
                <defs>
                    <linearGradient id="bg_${id}" x1="0%" y1="0%" x2="100%" y2="100%">
                        <stop offset="0%" stop-color="${t.bg1}" />
                        <stop offset="100%" stop-color="${t.bg2}" />
                    </linearGradient>
                    <linearGradient id="overlay_${id}" x1="0%" y1="100%" x2="0%" y2="0%">
                        <stop offset="0%" stop-color="rgba(0,0,0,0.9)" />
                        <stop offset="50%" stop-color="rgba(0,0,0,0.2)" />
                        <stop offset="100%" stop-color="rgba(0,0,0,0.4)" />
                    </linearGradient>
                </defs>
                <rect width="210" height="270" fill="url(#bg_${id})" />
                <circle cx="105" cy="110" r="70" fill="${t.accent}" opacity="0.15" />
                <rect width="210" height="270" fill="url(#overlay_${id})" />
                <rect x="8" y="8" width="194" height="254" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5" rx="10" />
                <rect x="15" y="15" width="85" height="20" rx="10" fill="rgba(255,255,255,0.12)" backdrop-filter="blur(5px)" />
                <text x="57.5" y="29" font-family="'Tajawal', sans-serif" font-size="9" fill="#fff" font-weight="900" text-anchor="middle">${t.name}</text>
                <text x="105" y="125" font-family="'Tajawal', sans-serif" font-size="12" fill="#ffffff" font-weight="bold" text-anchor="middle">
                    <tspan x="105" dy="0">${title.substring(0, 22)}</tspan>
                    <tspan x="105" dy="16">${title.length > 22 ? title.substring(22, 44) : ''}</tspan>
                </text>
            </svg>`;

            return 'data:image/svg+xml;utf8,' + encodeURIComponent(svg);
        }

        let selectedList = new Set();

        function filterAndRender() {
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            const genreVal = document.getElementById('genreSelect').value;
            const resultsGrid = document.getElementById('resultsGrid');
            
            resultsGrid.innerHTML = '';
            const fragment = document.createDocumentFragment();

            realManhwaList.forEach((item, index) => {
                const matchesSearch = item.title.toLowerCase().includes(searchVal);
                const matchesGenre = genreVal === 'all' || item.genre === genreVal;

                if (matchesSearch && matchesGenre) {
                    const card = document.createElement('div');
                    card.className = 'card' + (selectedList.has(item.title) ? ' selected' : '');

                    card.innerHTML = `
                        <div class="card-checkbox">✓</div>
                        <div class="card-img-wrapper">
                            <img src="${getDynamicCover(item.title, item.genre, index)}" alt="${item.title}" loading="lazy" width="210" height="270">
                        </div>
                        <div class="card-content">
                            <div class="card-title">${item.title}</div>
                            <div class="card-meta">
                                <span class="card-score">⭐ ${item.score}</span>
                                <span class="card-genre">${item.genre}</span>
                            </div>
                        </div>
                    `;

                    card.onclick = () => {
                        if (selectedList.has(item.title)) {
                            selectedList.delete(item.title);
                            card.classList.remove('selected');
                        } else {
                            selectedList.add(item.title);
                            card.classList.add('selected');
                        }
                        updateCount();
                    };

                    fragment.appendChild(card);
                }
            });

            resultsGrid.appendChild(fragment);
        }

        function updateCount() {
            document.getElementById('selectCount').innerText = selectedList.size;
        }

        function copySelected() {
            if (selectedList.size === 0) {
                alert('لم تقم بتحديد أي مانهوا بعد!');
                return;
            }
            const textToCopy = Array.from(selectedList).join('\n');
            navigator.clipboard.writeText(textToCopy);
            alert(`تم نسخ (${selectedList.size}) مانهوا إلى الحافظة بنجاح!`);
        }

        window.onload = filterAndRender;
    </script>
</body>
</html>
