<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SLAX Manhwa</title>
    <style>
        :root {
            --bg-color: #0d0405;
            --card-bg: #1a080a;
            --accent-color: #e50914;
            --accent-dark: #800000;
            --accent-hover: #ff1e27;
            --border-color: #3a0d11;
            --text-color: #ffffff;
            --text-dim: #b3999b;
            --gold-color: #ffcc00;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 1.5rem 0.8rem; text-align: center; min-height: 100vh; }

        .container { max-width: 1240px; margin: 0 auto; }
        
        header { margin-bottom: 1.8rem; }
        h1 { font-size: 2.4rem; font-weight: 900; letter-spacing: 1px; color: #fff; }
        h1 span { color: var(--accent-color); text-shadow: 0 0 15px rgba(229, 9, 20, 0.6); }
        p.sub { color: var(--text-dim); margin-top: 0.4rem; font-size: 0.9rem; }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            align-items: center;
            margin-bottom: 1.8rem;
            padding: 0 0.5rem;
        }

        input[type="text"], select {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            color: #fff;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            outline: none;
            font-size: 0.9rem;
            text-align: right;
            transition: border-color 0.2s;
        }

        input[type="text"] { width: 100%; max-width: 240px; }
        select { cursor: pointer; min-width: 140px; }

        input[type="text"]:focus, select:focus { border-color: var(--accent-color); }

        .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 0.75rem 1.3rem;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            text-decoration: none;
            box-shadow: 0 4px 12px rgba(229, 9, 20, 0.3);
        }

        .btn:hover { background-color: var(--accent-hover); }
        .btn:disabled { background-color: #2b0c10; color: #704044; cursor: not-allowed; box-shadow: none; }
        .btn-outline { background: transparent; border: 1px solid var(--border-color); color: var(--text-dim); box-shadow: none; }
        .btn-outline:hover { background: var(--card-bg); color: #fff; border-color: var(--accent-dark); }
        
        .btn-fav { background-color: var(--accent-dark); border: 1px solid var(--accent-color); }
        .btn-fav.active { background-color: var(--accent-color); }

        .counter-badge {
            background-color: var(--card-bg);
            border: 1px solid var(--accent-dark);
            padding: 0.75rem 1.2rem;
            border-radius: 8px;
            font-size: 0.9rem;
            font-weight: bold;
            color: #fff;
            box-shadow: 0 2px 8px rgba(128, 0, 0, 0.3);
        }

        .counter-badge span { color: var(--accent-color); }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 1.1rem;
        }

        @media (min-width: 600px) {
            .grid { grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); }
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            text-align: right;
            transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
            cursor: pointer;
            position: relative;
        }

        .card:hover { 
            transform: translateY(-5px); 
            border-color: var(--accent-color); 
            box-shadow: 0 8px 22px rgba(229, 9, 20, 0.35); 
        }

        .card img { width: 100%; height: 235px; object-fit: cover; background: #120406; }
        
        .fav-btn-icon {
            position: absolute;
            top: 8px;
            left: 8px;
            background: rgba(13, 4, 5, 0.82);
            backdrop-filter: blur(4px);
            border: 1px solid var(--accent-dark);
            color: #fff;
            border-radius: 50%;
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 1rem;
            transition: transform 0.2s, background-color 0.2s;
        }

        .fav-btn-icon.active { color: var(--accent-color); border-color: var(--accent-color); }
        .fav-btn-icon:hover { transform: scale(1.15); }

        .card-info { padding: 0.8rem; display: flex; flex-direction: column; gap: 0.4rem; }
        .card-title { font-size: 0.88rem; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        
        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.78rem;
        }

        .score { color: var(--gold-color); font-weight: bold; }
        .genres { font-size: 0.72rem; color: var(--text-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(5, 1, 2, 0.9);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 99999;
            padding: 1rem;
        }

        .modal-overlay.active { display: flex; }

        .modal {
            background-color: var(--card-bg);
            border: 1px solid var(--accent-dark);
            border-radius: 14px;
            max-width: 560px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            text-align: right;
            padding: 1.4rem;
            position: relative;
            box-shadow: 0 12px 35px rgba(0,0,0,0.95);
            animation: popIn 0.25s ease;
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.92); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-close {
            position: absolute;
            top: 0.9rem; left: 0.9rem;
            background: transparent;
            border: none;
            color: var(--text-dim);
            font-size: 1.7rem;
            cursor: pointer;
            line-height: 1;
        }

        .modal-header { display: flex; gap: 1rem; margin-bottom: 1rem; }
        .modal-header img { width: 115px; height: 165px; object-fit: cover; border-radius: 10px; flex-shrink: 0; }
        .modal-details { display: flex; flex-direction: column; gap: 0.5rem; justify-content: center; }
        .modal-title { font-size: 1.15rem; font-weight: bold; color: #fff; line-height: 1.35; }
        .modal-desc { font-size: 0.85rem; color: var(--text-dim); line-height: 1.6; margin-bottom: 1.2rem; max-height: 140px; overflow-y: auto; padding-right: 5px; }

        .modal-actions { display: flex; gap: 8px; flex-wrap: wrap; }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background-color: var(--accent-color);
            color: #fff;
            padding: 0.75rem 1.6rem;
            border-radius: 30px;
            font-size: 0.88rem;
            font-weight: bold;
            box-shadow: 0 5px 20px rgba(0,0,0,0.6);
            transition: transform 0.3s ease;
            z-index: 100000;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>SLAX <span>MANHWA</span></h1>
            <p class="sub">تصفح آمن وبدون تكرار مع نظام الفلترة والمفضلة</p>
        </header>
        
        <div class="controls">
            <input type="text" id="searchInput" placeholder="بحث بالاسم..." oninput="applyFilters()">
            
            <select id="genreSelect" onchange="applyFilters()">
                <option value="ALL">جميع التصنيفات</option>
                <option value="Action">أكشن (Action)</option>
                <option value="Fantasy">خيال (Fantasy)</option>
                <option value="Romance">رومانسية (Romance)</option>
                <option value="Drama">دراما (Drama)</option>
                <option value="Comedy">كوميديا (Comedy)</option>
                <option value="Adventure">مغامرة (Adventure)</option>
                <option value="Supernatural">خارق للطبيعة (Supernatural)</option>
                <option value="Slice of Life">شريحة من الحياة (Slice of Life)</option>
            </select>

            <select id="sortSelect" onchange="applyFilters()">
                <option value="DEFAULT">الترتيب الافتراضي</option>
                <option value="SCORE_DESC">الأعلى تقييماً ⭐</option>
                <option value="TITLE_ASC">أبجدي (A-Z)</option>
            </select>

            <button class="btn" id="loadBtn" onclick="fetchUniqueManhwa()">عرض 50 مانهوا جديدة ➔</button>
            <button class="btn btn-fav" id="favTabBtn" onclick="toggleFavView()">❤️ المفضلة (<span id="favCount">0</span>)</button>
            <button class="btn btn-outline" onclick="resetExclusions()">إعادة ضبط</button>
            
            <div class="counter-badge" id="countBadge">عدد المانهوات: <span id="manhwaCountNumber">0</span></div>
        </div>

        <div class="grid" id="manhwaGrid"></div>
    </div>

    <!-- Modal التفاصيل -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModal()">
        <div class="modal" onclick="event.stopPropagation()">
            <button class="modal-close" onclick="closeModal()">&times;</button>
            <div class="modal-header">
                <img id="modalImg" src="" alt="Cover">
                <div class="modal-details">
                    <div class="modal-title" id="modalTitle">اسم المانهوا</div>
                    <div class="score" id="modalScore">⭐ 0.0</div>
                    <div class="genres" id="modalGenres">التصنيف</div>
                </div>
            </div>
            <div class="modal-desc" id="modalDesc">الوصف غير متوفر حالياً.</div>
            <div class="modal-actions">
                <button class="btn" onclick="copyTitle()">📋 نسخ الاسم</button>
                <button class="btn btn-fav" id="modalFavBtn" onclick="toggleFavCurrent()">❤️ إضافة للمفضلة</button>
                <a id="searchGoogleBtn" target="_blank" class="btn btn-outline">🔍 بحث في Google</a>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">تمت العملية بنجاح!</div>

    <script>
        const blockedGenres = ["Boys Love", "Ecchi", "Hentai", "Yaoi", "Erotica", "Shounen Ai", "Yuri", "Shoujo Ai"];

        // القائمة الاصلية + الـ 150 مانهوا الجديدة مدمجة بدون تكرار[cite: 1, 2, 3, 4]
        const initialExcluded = [
            136331, 137304, 117540, 130870, 97897, 115000, 151025, 103156, 137595, 119276, 
            177706, 113666, 130429, 141007, 120385, 116506, 175262, 75275, 117536, 52651, 
            116382, 150836, 114542, 182066, 153432, 85155, 128882, 130149, 113488, 130229, 
            170894, 60079, 173020, 110605, 141958, 113055, 129210, 141013, 153880, 178379, 
            136204, 124577, 121565, 155485, 111075, 110042, 167834, 107720, 164857, 107918,
            141479, 120440, 165182, 107518, 165287, 85869, 110472, 123739, 175946, 119363, 
            159439, 153513, 108952, 187944, 129632, 144079, 130300, 100885, 141705, 122060, 
            118267, 149483, 85208, 113607, 139572, 180891, 132165, 128521, 132093, 129758, 
            114198, 146017, 140837, 168823, 153987, 117581, 103995, 151460, 138363, 101134, 
            130566, 166154, 135318, 124783, 133708, 87154, 137969, 180890, 150170, 139339,
            99489, 98055, 178464, 162852, 158259, 85619, 101507, 131965, 187452, 130861,
            130869, 150341, 136024, 130483, 170261, 128393, 124157, 120158, 117918, 100434,
            133936, 203958, 154626, 146498, 128221, 191727, 168147, 144208, 134456, 99745,
            133013, 98585, 155420, 159437, 103198, 170745, 188558, 121320, 152437, 99051,
            85827, 186503, 129843, 176731, 87198, 121813, 151220, 204435, 136766, 175903,
            148891, 159336, 142353, 97972, 187994, 86933, 141146, 178121, 123558, 99392,
            178876, 202718, 144090, 124599, 180272, 160192, 151130, 117923, 115044, 146514,
            128591, 189080, 126904, 156488, 150106, 140759, 156496, 109443, 143608, 111918,
            127983, 126849, 108791, 145261, 99005, 154973, 136969, 160178, 109270, 153788,
            154706, 98245, 166121, 121632, 100618, 141392, 160229, 182511, 140945, 164274,
            154190, 97753, 135397, 186610, 188071, 171937, 171709, 187324, 156020, 177058,
            188215, 126384, 112653, 132651, 151121, 170895, 134150, 183519, 115050, 178209,
            202549, 120235, 100859, 125568, 178176, 131129, 129256, 186963, 142364, 31268,
            125656, 173329, 171168, 102178, 177368, 111413, 180574, 169210, 132793, 142887,
            122948, 130456, 148342
        ];

        let savedExclusions = JSON.parse(localStorage.getItem('slax_excluded_ids')) || [];
        let favorites = JSON.parse(localStorage.getItem('slax_favorites')) || [];
        
        let excludedSet = new Set([...initialExcluded, ...savedExclusions]);
        let currentFetchedList = [];
        let activeItem = null;
        let showingFavs = false;

        function isClean(item) {
            if (!item) return false;
            if (item.isAdult) return false;
            if (item.genres && item.genres.some(g => blockedGenres.includes(g))) return false;
            return true;
        }

        function updateUIBadges() {
            document.getElementById('favCount').innerText = favorites.length;
            localStorage.setItem('slax_excluded_ids', JSON.stringify(Array.from(excludedSet)));
            localStorage.setItem('slax_favorites', JSON.stringify(favorites));
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2500);
        }

        async function fetchUniqueManhwa() {
            if (showingFavs) toggleFavView();
            
            const btn = document.getElementById('loadBtn');
            btn.innerText = "جاري الجلب...";
            btn.disabled = true;

            const query = `
            query GetMassiveManhwa($page: Int, $perPage: Int, $excluded: [Int]) {
              Page(page: $page, perPage: $perPage) {
                media(
                  type: MANGA, 
                  countryOfOrigin: "KR", 
                  sort: POPULARITY_DESC, 
                  id_not_in: $excluded,
                  isAdult: false,
                  genre_not_in: ["Boys Love", "Ecchi"]
                ) {
                  id
                  isAdult
                  title { english romaji }
                  coverImage { large }
                  averageScore
                  genres
                  description
                }
              }
            }`;

            try {
                const response = await fetch('https://graphql.anilist.co', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        query: query,
                        variables: { 
                            page: 1, 
                            perPage: 50, 
                            excluded: Array.from(excludedSet) 
                        }
                    })
                });

                const result = await response.json();
                if (!result.data || !result.data.Page || !result.data.Page.media) {
                    throw new Error("API Error");
                }

                const rawList = result.data.Page.media;
                const cleanList = rawList.filter(isClean);

                if (cleanList.length === 0) {
                    document.getElementById('manhwaGrid').innerHTML = '<p style="grid-column: 1/-1; padding: 2rem;">تم جلب جميع المانهوات المتاحة!</p>';
                    btn.innerText = "لا توجد نتائج جديدة";
                    document.getElementById('manhwaCountNumber').innerText = "0";
                    return;
                }

                currentFetchedList = cleanList;
                applyFilters();

                cleanList.forEach(item => excludedSet.add(item.id));
                updateUIBadges();

                btn.innerText = "عرض 50 مانهوا جديدة ➔";
                btn.disabled = false;

            } catch (err) {
                console.error(err);
                btn.innerText = "حدث خطأ، حاول مجدداً";
                btn.disabled = false;
            }
        }

        function renderCards(list) {
            const grid = document.getElementById('manhwaGrid');
            grid.innerHTML = '';

            document.getElementById('manhwaCountNumber').innerText = list.length;

            if(list.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; color: var(--text-dim); padding: 2rem;">لا توجد نتائج مطابقة لخيارات البحث والفلترة.</p>';
                return;
            }

            list.forEach(item => {
                const title = item.title.english || item.title.romaji || "بدون عنوان";
                const score = item.averageScore ? (item.averageScore / 10).toFixed(1) : 'N/A';
                const mainGenre = item.genres && item.genres.length > 0 ? item.genres.slice(0, 2).join(', ') : 'Manhwa';
                const isFav = favorites.some(f => f.id === item.id);

                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => openModal(item);
                card.innerHTML = `
                    <button class="fav-btn-icon ${isFav ? 'active' : ''}" onclick="event.stopPropagation(); toggleFav(${item.id})">
                        ${isFav ? '❤️' : '🤍'}
                    </button>
                    <img src="${item.coverImage.large}" alt="${title}" loading="lazy" onerror="this.src='https://via.placeholder.com/180x235?text=No+Cover'">
                    <div class="card-info">
                        <div class="card-title" title="${title}">${title}</div>
                        <div class="card-meta">
                            <span class="score">⭐ ${score}</span>
                            <span class="genres">${mainGenre}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function applyFilters() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase().trim();
            const genreTerm = document.getElementById('genreSelect').value;
            const sortTerm = document.getElementById('sortSelect').value;

            const targetList = showingFavs ? favorites : currentFetchedList;

            let filtered = targetList.filter(item => {
                if(!isClean(item)) return false;
                const engTitle = (item.title.english || '').toLowerCase();
                const romTitle = (item.title.romaji || '').toLowerCase();
                const matchesSearch = engTitle.includes(searchTerm) || romTitle.includes(searchTerm);
                const matchesGenre = (genreTerm === 'ALL') || (item.genres && item.genres.includes(genreTerm));

                return matchesSearch && matchesGenre;
            });

            if (sortTerm === 'SCORE_DESC') {
                filtered.sort((a, b) => (b.averageScore || 0) - (a.averageScore || 0));
            } else if (sortTerm === 'TITLE_ASC') {
                filtered.sort((a, b) => {
                    const nameA = a.title.english || a.title.romaji || "";
                    const nameB = b.title.english || b.title.romaji || "";
                    return nameA.localeCompare(nameB);
                });
            }

            renderCards(filtered);
        }

        function toggleFav(id) {
            const foundIndex = favorites.findIndex(f => f.id === id);
            if (foundIndex > -1) {
                favorites.splice(foundIndex, 1);
                showToast("تمت الإزالة من المفضلة");
            } else {
                const item = currentFetchedList.find(i => i.id === id) || activeItem;
                if (item) {
                    favorites.push(item);
                    showToast("تمت الإضافة للمفضلة! ❤️");
                }
            }
            updateUIBadges();
            applyFilters();
            if(activeItem && activeItem.id === id) updateModalFavBtn();
        }

        function toggleFavView() {
            showingFavs = !showingFavs;
            const favBtn = document.getElementById('favTabBtn');
            if (showingFavs) {
                favBtn.classList.add('active');
                showToast("عرض المانهوات المفضلة");
            } else {
                favBtn.classList.remove('active');
            }
            applyFilters();
        }

        function openModal(item) {
            activeItem = item;
            const title = item.title.english || item.title.romaji || "بدون عنوان";

            let cleanDesc = item.description || 'لا يوجد وصف متوفر لهذه المانهوا حالياً.';
            cleanDesc = cleanDesc.replace(/<[^>]*>?/gm, '');

            document.getElementById('modalImg').src = item.coverImage.large;
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalScore').innerText = `⭐ ${item.averageScore ? (item.averageScore / 10).toFixed(1) : 'N/A'}`;
            document.getElementById('modalGenres').innerText = item.genres ? item.genres.join(', ') : 'Manhwa';
            document.getElementById('modalDesc').innerText = cleanDesc;
            document.getElementById('searchGoogleBtn').href = `https://www.google.com/search?q=${encodeURIComponent(title + ' manhwa')}`;

            updateModalFavBtn();
            document.getElementById('modalOverlay').classList.add('active');
        }

        function updateModalFavBtn() {
            if(!activeItem) return;
            const isFav = favorites.some(f => f.id === activeItem.id);
            const btn = document.getElementById('modalFavBtn');
            btn.innerText = isFav ? "❤️ في المفضلة" : "🤍 إضافة للمفضلة";
        }

        function toggleFavCurrent() {
            if (activeItem) toggleFav(activeItem.id);
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('active');
        }

        function copyTitle() {
            if (!activeItem) return;
            const title = activeItem.title.english || activeItem.title.romaji;

            if (navigator.clipboard && window.isSecureContext) {
                navigator.clipboard.writeText(title).then(() => {
                    showToast("تم نسخ الاسم بنجاح!");
                }).catch(() => fallbackCopy(title));
            } else {
                fallbackCopy(title);
            }
        }

        function fallbackCopy(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.left = "-9999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                showToast("تم نسخ الاسم بنجاح!");
            } catch (err) {
                alert("الاسم: " + text);
            }
            document.body.removeChild(textArea);
        }

        function resetExclusions() {
            if (confirm("هل تريد إعادة ضبط القائمة والبدء من جديد؟")) {
                localStorage.removeItem('slax_excluded_ids');
                excludedSet = new Set(initialExcluded);
                updateUIBadges();
                fetchUniqueManhwa();
            }
        }

        updateUIBadges();
        fetchUniqueManhwa();
    </script>
</body>
</html>
